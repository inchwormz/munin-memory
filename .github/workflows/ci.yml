name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked --bin munin

      - name: Test
        run: cargo test --locked -- --test-threads 1

      - name: Resolver and skill contracts
        run: cargo run --locked --bin munin -- install --check-resolvable

      - name: Non-technical release check
        shell: pwsh
        run: |
          $bin = if ($IsWindows) { ".\target\debug\munin.exe" } else { "./target/debug/munin" }
          ./scripts/munin-release-check.ps1 -MuninBin $bin

  licenses:
    name: License allowlist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  windows-gnu:
    name: Rust checks (windows-gnu)
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: target-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW-w64 to PATH
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: '"$env:MSYS2_LOCATION\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Install Rust GNU target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --target x86_64-pc-windows-gnu --bin munin

      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-gnu -- --test-threads 1
